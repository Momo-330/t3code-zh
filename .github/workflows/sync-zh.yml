name: Sync upstream and release

# Keeps this fork about an hour behind pingdotgg/t3code, then publishes a
# Chinese Windows build every four hours when changes await release,
# so the app's "Check for updates" has something new without shipping
# a 160 MB release every hour.
#
# Upstream lands 100+ commits a day. Hourly merges keep conflicts small; the
# publish gate (UTC hours 2, 6, 10, 14, 18, 22) reuses the newest merge since
# the last release window.
#
# Workflow conflicts keep the fork's CI. Source conflicts stop the sync and
# list the affected files in the job summary to protect fork-specific features.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-zh.yml
      - .github/workflows/release-zh-windows.yml
      - scripts/sync-upstream.sh
      - scripts/zh-release-needed.sh
  schedule:
    # Every hour at :17 UTC, off the hour so the job does not queue behind the busiest slot.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build and release even when nothing changed"
        required: false
        default: false
        type: boolean

concurrency:
  group: sync-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Scheduled publish windows: UTC hours where hour % 4 == 2 (02/06/10/14/18/22 UTC;
  # 10:17–06:17 Beijing). Other hourly runs merge only.
  RELEASE_HOUR_MOD: "4"
  RELEASE_HOUR_OFFSET: "2"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
      publish: ${{ steps.gate.outputs.publish }}
      version: ${{ steps.version.outputs.value }}
      commit: ${{ steps.source.outputs.commit }}
      upstream-commit: ${{ steps.upstream.outputs.commit }}
      upstream-stable: ${{ steps.upstream.outputs.stable }}
      upstream-ahead: ${{ steps.upstream.outputs.ahead }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/pingdotgg/t3code.git
          # Full history: a shallow fetch looks like an unrelated history to git.
          # Upstream averages 100+ commits a day, so blame-adjacent depth matters
          # less than being able to merge at all.
          git fetch upstream main --tags

      - name: Merge upstream
        id: merge
        run: bash scripts/sync-upstream.sh upstream/main

      - name: Push the merge
        if: steps.merge.outputs.changed == 'true'
        # If main moved, fail without rewriting history; the next run starts fresh.
        run: git push origin HEAD:main

      - name: Record the merged source
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Decide whether to publish
        id: gate
        env:
          FORCE_RELEASE: ${{ inputs.force }}
        run: bash scripts/zh-release-needed.sh

      - name: Resolve the next version
        id: version
        if: steps.gate.outputs.publish == 'true'
        run: |
          # Versions must only move forward: electron-updater refuses anything
          # that is not greater than the installed build. Upstream's
          # package.json version does not change per commit (it sits at 0.1.2
          # while main runs ahead), so a fresh base like "0.1.2-zh.1" could sort
          # below an already-published "0.1.3-zh.2" and never reach users.
          upstream_version=$(node -p "require('./apps/desktop/package.json').version")
          # List tags directly: parsing release JSON inside a shell heredoc is
          # fragile, and every published release has a matching zh-v* tag.
          latest=$(git ls-remote --tags --refs origin 'zh-v*' 2>/dev/null \
            | sed 's#.*refs/tags/zh-v##' \
            | sort -V | tail -1)

          if [[ -z "$latest" ]]; then
            value="${upstream_version}-zh.1"
          else
            # Compare the numeric triple, then the fork sequence.
            latest_base=${latest%-zh.*}
            latest_seq=${latest##*-zh.}
            highest=$(printf '%s\n%s\n' "$latest_base" "$upstream_version" | sort -V | tail -1)
            if [[ "$highest" == "$latest_base" ]]; then
              # Upstream has not moved past the published base; bump the sequence.
              value="${latest_base}-zh.$((latest_seq + 1))"
            else
              # Upstream moved to a new base; restart the sequence on it.
              value="${upstream_version}-zh.1"
            fi
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "releasing $value (latest published: ${latest:-none}, upstream base: $upstream_version)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Record which upstream build this is
        id: upstream
        run: |
          # The nearest upstream tag tells users how current this build is;
          # the commit count since then says how far ahead it runs.
          tag=$(git describe --tags --abbrev=0 upstream/main 2>/dev/null || echo "no-tag")
          # Ignore nightly tags when naming the release: a date stamp per build
          # is noise to a user asking "which version is this".
          stable=$(git tag --list "v*" --sort=-creatordate \
            | grep -Ev 'nightly|preview' | head -1 || true)
          stable=${stable:-none}
          ahead=$(git rev-list --count "${stable}..upstream/main" 2>/dev/null || echo "?")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          echo "ahead=$ahead" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short upstream/main)" >> "$GITHUB_OUTPUT"

      - name: Setup dependencies for translation coverage
        if: steps.merge.outputs.changed == 'true'
        continue-on-error: true
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --frozen-lockfile --filter @t3tools/web...

      - name: Report what needs translating
        if: steps.merge.outputs.changed == 'true'
        continue-on-error: true
        run: |
          # Lists untranslated strings in the job summary. The build still ships
          # with English fallbacks, so a missing translation never blocks a sync.
          # Coverage reporting must not fetch, merge, or change the release source.
          node scripts/t3-sync.ts --report-only > "$RUNNER_TEMP/sync-report.txt" 2>&1 || true
          {
            echo "### Untranslated strings"
            echo '```'
            sed -n '/need a translation/,$p' "$RUNNER_TEMP/sync-report.txt" | head -200
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: sync
    if: needs.sync.outputs.publish == 'true'
    uses: ./.github/workflows/release-zh-windows.yml
    with:
      version: ${{ needs.sync.outputs.version }}
      source-commit: ${{ needs.sync.outputs.commit }}
      upstream-commit: ${{ needs.sync.outputs.upstream-commit }}
      upstream-stable: ${{ needs.sync.outputs.upstream-stable }}
      upstream-ahead: ${{ needs.sync.outputs.upstream-ahead }}
    secrets: inherit
