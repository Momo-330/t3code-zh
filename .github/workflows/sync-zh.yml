name: Sync upstream and release

# Keeps this fork within a few hours of pingdotgg/t3code, then publishes one
# Chinese build per day so the app's "Check for updates" has something new.
#
# Upstream lands 100+ commits a day. Merging that often keeps conflicts small;
# building that often would ship a 160 MB release every hour, so the build is
# gated on RELEASE_HOUR and reuses the newest merge of the day.
#
# A merge conflict fails the run instead of guessing: this fork owns only the
# dictionary and the transform, everything else takes upstream verbatim.

on:
  schedule:
    # Every 4 hours, off the hour so the job does not queue behind the busiest slot.
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build and release even when nothing changed"
        required: false
        default: false
        type: boolean

concurrency:
  group: sync-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Only the 02:17 UTC run (10:17 Beijing) publishes; the others just merge.
  RELEASE_HOUR: "2"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
      publish: ${{ steps.gate.outputs.publish }}
      version: ${{ steps.version.outputs.value }}
      upstream-commit: ${{ steps.upstream.outputs.commit }}
      upstream-stable: ${{ steps.upstream.outputs.stable }}
      upstream-ahead: ${{ steps.upstream.outputs.ahead }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/pingdotgg/t3code.git
          # Full history: a shallow fetch looks like an unrelated history to git.
          # Upstream averages 100+ commits a day, so blame-adjacent depth matters
          # less than being able to merge at all.
          git fetch upstream main --tags

      - name: Merge upstream
        id: merge
        run: |
          behind=$(git rev-list --count HEAD..upstream/main)
          echo "upstream commits behind: $behind"
          if [[ "$behind" == "0" && "${{ inputs.force }}" != "true" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git merge upstream/main --no-edit -m "chore: sync upstream"; then
            echo "::error::Merge conflict. Upstream touched files this fork edits."
            git merge --abort || true
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push the merge
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:main

      - name: Decide whether to publish
        id: gate
        run: |
          # Manual force always publishes. Scheduled runs publish only in
          # RELEASE_HOUR so one merge a day becomes one release.
          if [[ "${{ inputs.force }}" == "true" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ steps.merge.outputs.changed }}" != "true" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour=$(date -u +%H | sed 's/^0//')
          if [[ "$hour" == "$RELEASE_HOUR" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Merged without publishing; the ${RELEASE_HOUR}:17 UTC run releases."
          fi

      - name: Resolve the next version
        id: version
        if: steps.gate.outputs.publish == 'true'
        run: |
          # Base the number on upstream's package version, sequence on this fork.
          base=$(node -p "require('./apps/desktop/package.json').version")
          latest=$(gh release list --limit 20 --json tagName \
            --jq '[.[] | .tagName | select(startswith("zh-v"))] | first // "zh-v0.0.0-zh.0"' \
            | sed 's/^zh-v//')
          seq=${latest##*-zh.}
          if [[ "$latest" == "${base}-zh."* ]]; then
            next=$((seq + 1))
          else
            next=1
          fi
          value="${base}-zh.${next}"
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "releasing $value (previous: $latest)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Record which upstream build this is
        id: upstream
        run: |
          # The nearest upstream tag tells users how current this build is;
          # the commit count since then says how far ahead it runs.
          tag=$(git describe --tags --abbrev=0 upstream/main 2>/dev/null || echo "no-tag")
          # Ignore nightly tags when naming the release: a date stamp per build
          # is noise to a user asking "which version is this".
          stable=$(git tag --list "v*" --sort=-creatordate \
            | grep -Ev 'nightly|preview' | head -1 || true)
          stable=${stable:-none}
          ahead=$(git rev-list --count "${stable}..upstream/main" 2>/dev/null || echo "?")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          echo "ahead=$ahead" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short upstream/main)" >> "$GITHUB_OUTPUT"

      - name: Report what needs translating
        if: steps.merge.outputs.changed == 'true'
        continue-on-error: true
        run: |
          # Lists untranslated strings in the job summary. The build still ships
          # with English fallbacks, so a missing translation never blocks a sync.
          npm install --silent >/dev/null 2>&1 || true
          npm run t3:sync > sync-report.txt 2>&1 || true
          {
            echo "### Untranslated strings"
            echo '```'
            sed -n '/need a translation/,$p' sync-report.txt | head -200
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: sync
    if: needs.sync.outputs.publish == 'true'
    uses: ./.github/workflows/release-zh-windows.yml
    with:
      version: ${{ needs.sync.outputs.version }}
      upstream-commit: ${{ needs.sync.outputs.upstream-commit }}
      upstream-stable: ${{ needs.sync.outputs.upstream-stable }}
      upstream-ahead: ${{ needs.sync.outputs.upstream-ahead }}
    secrets: inherit
