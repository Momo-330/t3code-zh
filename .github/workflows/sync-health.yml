name: Sync health

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-health.yml
      - .github/scripts/check-sync-health.cjs
      - .github/scripts/check-sync-health.test.cjs
  workflow_run:
    workflows: [Sync upstream and release, Release Windows desktop, CI]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: sync-health
  cancel-in-progress: true

jobs:
  inspect:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_branch == github.event.repository.default_branch &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Load trusted inspector, test rules and check status
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { execFileSync } = require('node:child_process');
            const branch = context.payload.repository.default_branch;
            const { data: head } = await github.rest.repos.getCommit({ ...context.repo, ref: branch });
            const directory = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'sync-health-'));
            for (const name of ['check-sync-health.cjs', 'check-sync-health.test.cjs']) {
              const { data: file } = await github.rest.repos.getContent({
                ...context.repo, path: `.github/scripts/${name}`, ref: head.sha,
              });
              if (file.type !== 'file' || file.encoding !== 'base64') {
                throw new Error(`Cannot load trusted inspector: ${name}`);
              }
              fs.writeFileSync(path.join(directory, name), Buffer.from(file.content, 'base64'));
            }
            core.info(`Loaded health rules from ${head.sha}`);
            execFileSync(process.execPath, ['--test', path.join(directory, 'check-sync-health.test.cjs')], { stdio: 'inherit' });
            const { check } = require(path.join(directory, 'check-sync-health.cjs'));
            await check({ github, context, core });
