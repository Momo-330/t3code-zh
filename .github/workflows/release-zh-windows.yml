name: Release Windows desktop

# Builds the Chinese desktop app for Windows and attaches it to a GitHub Release.
# Deliberately simpler than upstream's release.yml: one platform, no signing, no
# nightly cadence. Run it manually or on a tag.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for this build, for example 0.1.3-zh.1"
        required: true
        type: string
  push:
    tags:
      - "zh-v*"

concurrency:
  group: release-zh-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#zh-v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure Electron runtime
        run: npm --prefix apps/desktop run ensure:electron

      - name: Build the Windows installer
        env:
          # Turns on the Chinese renderer transform (see apps/web/vite/localizeI18nPlugin.ts).
          T3CODE_WEB_LOCALE: zh-CN
          # No feed: this fork updates by rebuilding, never by downloading upstream builds.
          T3CODE_DISABLE_AUTO_UPDATE: "true"
        run: pnpm run dist:desktop:win --build-version "${{ steps.version.outputs.value }}"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zh-v${{ steps.version.outputs.value }}
          name: "T3 Code 中文版 ${{ steps.version.outputs.value }}"
          body: |
            中文界面的 T3 Code 桌面端（个人 fork）。

            基于上游 ${{ github.sha }} 构建，仅包含 Windows 安装包。
            自动更新未启用：需要新版本时重新运行此工作流即可。
          draft: false
          prerelease: false
          files: |
            release/*.exe
            release/*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
