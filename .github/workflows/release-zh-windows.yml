name: Release Windows desktop

# Builds the Chinese desktop app for Windows and attaches it to a GitHub Release.
# Deliberately simpler than upstream's release.yml: one platform, no signing, no
# nightly cadence. Run it manually or on a tag.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for this build, for example 0.1.3-zh.1"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: "Version for this build"
        required: true
        type: string
      upstream-commit:
        description: "Upstream commit this build is based on"
        required: false
        default: ""
        type: string
      upstream-stable:
        description: "Nearest upstream stable tag"
        required: false
        default: ""
        type: string
      upstream-ahead:
        description: "Commits ahead of that stable tag"
        required: false
        default: ""
        type: string
  push:
    tags:
      - "zh-v*"

concurrency:
  group: release-zh-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#zh-v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure Electron runtime
        run: npm --prefix apps/desktop run ensure:electron

      - name: Build the Windows installer
        env:
          # Turns on the Chinese renderer transform (see apps/web/vite/localizeI18nPlugin.ts).
          T3CODE_WEB_LOCALE: zh-CN
          # Points the packaged updater at this fork's own releases, so
          # "Check for updates" finds Chinese builds and never upstream ones.
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
        run: pnpm run dist:desktop:win --build-version "${{ steps.version.outputs.value }}"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zh-v${{ steps.version.outputs.value }}
          name: "T3 Code 中文版 ${{ steps.version.outputs.value }}"
          body: |
            中文界面的 T3 Code 桌面端（个人 fork），仅包含 Windows 安装包。

            | | |
            | --- | --- |
            | 中文版版本 | `${{ steps.version.outputs.value }}` |
            | 上游稳定版 | ${{ inputs.upstream-stable != '' && inputs.upstream-stable || '（手动构建）' }} |
            | 领先稳定版 | ${{ inputs.upstream-ahead != '' && format('{0} 个提交', inputs.upstream-ahead) || '—' }} |
            | 上游提交 | `${{ inputs.upstream-commit != '' && inputs.upstream-commit || github.sha }}` |

            **更新方式**：安装后在应用内点「检查更新」。更新源指向本仓库，
            只会下载中文版，不会拉取上游英文版。下载和安装都需要你手动确认。

            **与官方版的差别**：只改界面语言。同步机制、性能、功能与同一上游提交完全一致。
          draft: false
          prerelease: false
          files: |
            release/*.exe
            release/*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
