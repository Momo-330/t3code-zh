name: Verify Magpie connection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/verify-magpie.yml]

permissions:
  contents: read

concurrency:
  group: verify-magpie
  cancel-in-progress: false

jobs:
  connection:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Load the pinned provider configuration
        uses: actions/github-script@v8
        env:
          HAS_KEY: ${{ secrets.MAGPIE_API_KEY != '' }}
        with:
          script: |
            if (process.env.HAS_KEY !== 'true') {
              core.setFailed('MAGPIE_API_KEY 未配置，或不在 Repository secrets 中。');
              return;
            }
            core.notice('MAGPIE_API_KEY 已配置。');
            const fs = require('node:fs');
            const path = require('node:path');
            const { data } = await github.rest.repos.getContent({ ...context.repo, path: '.github/scripts/magpie-repair.cjs', ref: context.sha });
            if (data.type !== 'file' || data.encoding !== 'base64') throw new Error('Cannot load the pinned provider configuration');
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'magpie-connection-config.cjs'), Buffer.from(data.content, 'base64'));

      - name: Install the same OpenCode version used for repairs
        run: |
          npm install --prefix "$RUNNER_TEMP/connection-cli" --no-audit --no-fund opencode-ai@1.3.15
          echo "$RUNNER_TEMP/connection-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Verify the key through a minimal real OpenCode turn
        uses: actions/github-script@v8
        env:
          MAGPIE_API_KEY: ${{ secrets.MAGPIE_API_KEY }}
          MAGPIE_REPAIR_PROVIDER: ${{ vars.MAGPIE_REPAIR_PROVIDER || 'opencode-go' }}
          MAGPIE_REPAIR_MODEL: ${{ vars.MAGPIE_REPAIR_MODEL }}
          REPAIR_SWITCH: ${{ vars.CODEX_AUTO_REPAIR }}
          REPAIR_ENGINE: ${{ vars.SYNC_REPAIR_ENGINE || 'opencode' }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { execFileSync, spawnSync } = require('node:child_process');
            const { configuration, executionEnvironment } = require(path.join(process.env.RUNNER_TEMP, 'magpie-connection-config.cjs'));
            const config = configuration(process.env.MAGPIE_REPAIR_PROVIDER, process.env.MAGPIE_REPAIR_MODEL, ['connection-check.txt']);
            const [identity, model] = config.model.split('/');
            config.provider[identity].models[model].limit.output = 128;
            config.permission = { '*': 'deny' };
            config.agent['upstream-repair'].steps = 1;
            const directory = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'magpie-connection-'));
            const cwd = path.join(directory, 'empty-repo');
            fs.mkdirSync(cwd);
            execFileSync('git', ['init', '--quiet'], { cwd });
            const env = executionEnvironment(config, path.join(directory, 'runtime'), process.env);
            const result = spawnSync('opencode', ['run', '--format', 'json', '--agent', 'upstream-repair', '--model', config.model, '--title', 'Connection check'], {
              cwd, env, input: 'Reply OK. Do not use tools or inspect files.', encoding: 'utf8', timeout: 90000, maxBuffer: 4 * 1024 * 1024,
            });
            const events = (result.stdout || '').split('\n').flatMap(line => {
              try { return [JSON.parse(line)]; } catch { return []; }
            });
            const failures = events.filter(event => event.type === 'error');
            for (const failure of failures) {
              const message = failure.error?.data?.message;
              if (typeof message === 'string') {
                const key = process.env.MAGPIE_API_KEY;
                const safe = message.replaceAll(key, '[REDACTED]').replaceAll(key.trim(), '[REDACTED]').replace(/sk-[A-Za-z0-9_-]+/g, '[REDACTED]').slice(0, 600);
                core.notice(`厂商错误说明（已脱敏）：${safe}`);
              }
            }
            if (result.error || result.status !== 0 || failures.length || !events.some(event => event.type === 'step_finish')) {
              core.setFailed('OpenCode 未完成模型连接检查。请查看脱敏厂商说明；原始输出未展示。');
              return;
            }
            core.notice(`Magpie 真实 OpenCode 请求通过：${config.model}。`);
            const enabled = process.env.REPAIR_ENGINE === 'opencode' && (process.env.REPAIR_SWITCH === '' || process.env.REPAIR_SWITCH === 'true');
            if (enabled) core.notice('自动冲突修复已启用，将在普通同步失败且发现实际源码冲突时尝试修复。');
            else core.warning('Key 可用，但自动修复未启用 Magpie：检查 CODEX_AUTO_REPAIR 和 SYNC_REPAIR_ENGINE。');
            await core.summary.addHeading('Magpie 连接检查').addRaw(`已确认 Repository secret 存在，${config.model} 真实 OpenCode 请求成功。自动修复${enabled ? '已启用' : '未启用 Magpie'}。本次只验证连接，没有执行真实仓库冲突修复。`).write();
